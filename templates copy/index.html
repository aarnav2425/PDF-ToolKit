function post(u,fd,up){return new Promise((res,rej)=>{const x=new XMLHttpRequest();x.open('POST',u);x.responseType='blob';

$('pgrid').ondragend=()=>{dragI=null;renderOrg()};
$('pgrid').ondragover=e=>{if(dragI===null)return;e.preventDefault();const li=e.target.closest('li');$('pgrid').querySelectorAll('.dropt').forEach(n=>n.classList.remove('dropt'));li&&li.classList.add('dropt')};
$('pgrid').ondrop=e=>{const li=e.target.closest('li');if(li&&dragI!==null){e.preventDefault();const [m]=pg.splice(dragI,1);pg.splice(+li.dataset.i,0,m);dragI=null;renderOrg()}};
$('orotall').onclick=()=>{pg.forEach(x=>x.r=(x.r+90)%360);renderOrg()};
$('oreset').onclick=()=>{pg=orig.map(x=>({...x}));renderOrg();refreshRun()};
$('oclose').onclick=()=>{closeOrg();$('out').className='proof';renderOrg();refreshRun()};

/* ---- results, preview ---- */
async function showResult(x,t){const b=x.response,out=$('out');
 const name=(x.getResponseHeader('Content-Disposition')||'').match(/filename="?([^";]+)/)?.[1]||'result';
 const o=+x.getResponseHeader('X-Original-Size'),n=+x.getResponseHeader('X-Result-Size')||b.size,bd=x.getResponseHeader('X-Batch-Done'),bf=+x.getResponseHeader('X-Batch-Failed')||0;
 let note=o?(n<o?`<span class="save">${Math.round(100-n/o*100)}% smaller</span>, was ${fmt(o)}`:`Not smaller than the original (${fmt(o)}). Try the other method.`):'Ready to download';
 if(bd!==null)note=`${+bd} file${bd==1?'':'s'} done`+(bf?`, <span style="color:var(--er)">${bf} failed (see _errors.txt in the ZIP)</span>`:'')+(o?`. ${n<o?Math.round(100-n/o*100)+'% smaller than the originals':'Total '+fmt(n)}`:'');
 if(url)URL.revokeObjectURL(url);url=URL.createObjectURL(b);
 const pdf=/\.pdf$/i.test(name),htm=/\.html?$/i.test(name);
 out.innerHTML=`<span class="ri">${ico('ck',20)}</span><div class="t"><b>${esc(name)}</b><small>${fmt(n)}. ${note}</small></div>`+((pdf||htm)?`<button class="sm" id="pv">${ico('e',16)}Preview</button>`:'')+`<a class="btn" href="${url}" download="${esc(name)}">${ico('v',16)}Download</a><div class="prev" id="prev" hidden></div>`;out.className='proof show';
 if(pdf)$('pv').onclick=()=>preview(b);else if(htm)$('pv').onclick=()=>previewHtml(b);
 if(keep()&&b.size<=30e6)hAdd({name,tool:cur,size:b.size,t:Date.now(),blob:b}).then(histRender).catch(()=>{})}
async function previewHtml(b){const btn=$('pv'),box=$('prev');
 if(b.size>5e6){btn.textContent='Too large to preview (over 5 MB)';btn.disabled=true;return}
 const f=document.createElement('iframe');f.className='hp';f.setAttribute('sandbox','');f.setAttribute('title','Preview of the HTML result');f.srcdoc=await b.text();
 const n=document.createElement('p');n.className='hpn';n.textContent='Preview only: scripts and outside images are blocked here, so the downloaded file may look slightly different.';
 box.innerHTML='';box.style.display='block';box.append(f,n);box.hidden=false;btn.remove()}
async function preview(b){const btn=$('pv'),box=$('prev');btn.disabled=true;
 try{const fd=new FormData();fd.append('file',new File([b],'preview.pdf',{type:'application/pdf'}));fd.append('width',360);fd.append('limit',6);
  const x=await post('/api/pdf-thumbs',fd);if(x.status>=400)throw new Error(await failText(x));const j=JSON.parse(await x.response.text());
  box.innerHTML=j.thumbs.filter(t=>/^[A-Za-z0-9+\/=]+$/.test(t.b64)).map((t,i)=>`<figure><img src="data:image/jpeg;base64,${t.b64}" alt="Page ${i+1}"><span>Page ${i+1}</span></figure>`).join('')+(j.pages>j.thumbs.length?`<figure style="align-self:center"><span>${j.pages-j.thumbs.length} more page${j.pages-j.thumbs.length==1?'':'s'}</span></figure>`:'');
  box.hidden=false;btn.remove()}catch(e){btn.disabled=false;btn.textContent=e.message}}

$('run').onclick=async()=>{const t=TOOLS[cur],fd=new FormData();$('out').className='proof';
 if(isOrg()){fd.append('file',orgFile);fd.append('ops',JSON.stringify(pg.map(x=>[x.p,x.r])))}
 else files.forEach(f=>fd.append(t.multi?'files':'file',f));
 $('opts').querySelectorAll('[data-k]').forEach(el=>fd.append(el.dataset.k,el.value));
 try{await showResult(await call('/api/'+cur,fd),t)}catch(e){showError(e.message)}};

/* ---- recent results (optional, stored only in this browser) ---- */
const HMAX=8,HTTL=864e5,keep=()=>{try{return localStorage.getItem('keepHistory')=='1'}catch(e){return false}};
const dbp=()=>new Promise((res,rej)=>{const r=indexedDB.open('pdftoolkit',1);r.onupgradeneeded=()=>r.result.createObjectStore('h',{keyPath:'id',autoIncrement:true});r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});
const rq=r=>new Promise((res,rej)=>{r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});
async function hDo(fn){const db=await dbp();try{return await fn(db.transaction('h','readwrite').objectStore('h'))}finally{db.close()}}
const hList=()=>hDo(async st=>(await rq(st.getAll())).sort((a,b)=>b.t-a.t));
const hAdd=rec=>hDo(async st=>{await rq(st.add(rec));const all=(await rq(st.getAll())).sort((a,b)=>b.t-a.t);for(const x of all.slice(HMAX))await rq(st.delete(x.id))});
const hDel=id=>hDo(st=>rq(st.delete(id)));const hClear=()=>hDo(st=>rq(st.clear()));
const ago=t=>{const s=(Date.now()-t)/1e3;return s<60?'just now':s<3600?Math.floor(s/60)+' min ago':s<86400?Math.floor(s/3600)+' h ago':new Date(t).toLocaleDateString()};
let hcache=[];
async function histRender(){const on=keep();$('hk').checked=on;hcache=[];
 if(on&&window.indexedDB){try{hcache=await hList();const old=hcache.filter(h=>Date.now()-h.t>HTTL);await Promise.all(old.map(h=>hDel(h.id)));hcache=hcache.filter(h=>Date.now()-h.t<=HTTL)}catch(e){}}
 $('hl').innerHTML=hcache.map(h=>`<li class="row hrow" data-id="${h.id}">${extb(h.name)}<span class="nm">${esc(h.name)}</span><span class="sz">${esc(TOOLS[h.tool]?TOOLS[h.tool].n:'')} · ${ago(h.t)} · ${fmt(h.size)}</span><span class="ib"><button data-a="dl" aria-label="Download ${esc(h.name)}">${ico('v',15)}</button><button data-a="rm" aria-label="Remove ${esc(h.name)}">${ico('d',15)}</button></span></li>`).join('');
 $('hclr').hidden=!hcache.length;$('hn').hidden=on&&hcache.length>0;
 if(on&&!hcache.length)$('hn').textContent='Nothing saved yet. New results will appear here.';else if(!on)$('hn').textContent='Off by default. When on, your last few results are stored in this browser only (never on the server) for up to 24 hours, so you can download them again.'}
$('hk').onchange=async e=>{try{localStorage.setItem('keepHistory',e.target.checked?'1':'0')}catch(x){}if(!e.target.checked)await hClear().catch(()=>{});histRender()};
$('hclr').onclick=async()=>{await hClear().catch(()=>{});histRender()};
$('hl').onclick=async e=>{const b=e.target.closest('button'),li=e.target.closest('li');if(!b)return;const id=+li.dataset.id;
 if(b.dataset.a=='rm'){await hDel(id).catch(()=>{});histRender()}
 else{const h=hcache.find(x=>x.id==id);if(h){const u=URL.createObjectURL(h.blob),a=document.createElement('a');a.href=u;a.download=h.name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),4e3)}}};

async function disk(){try{const j=await(await fetch('/api/disk-usage')).json();if(j.bytes==null){clearInterval(diskTimer);$('disk').parentElement.style.display='none';return}$('disk').textContent='Workspace in use: '+fmt(j.bytes)}catch(e){}}
var diskTimer;disk();diskTimer=setInterval(disk,2000);select('merge-pdf');histRender();
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('/sw.js').catch(()=>{}));
</script></body></html>
