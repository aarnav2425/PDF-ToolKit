  const o=+r.headers.get('X-Original-Size'),n=+r.headers.get('X-Result-Size')||b.size;
  const note=o?(n<o?`<span class="save">${Math.round(100-n/o*100)}% smaller</span>, was ${fmt(o)}`:`Not smaller than the original (${fmt(o)}). Try the other method.`):'Ready to download';
  out.innerHTML=`<div class="t"><b>${esc(name)}</b><small>${fmt(n)}. ${note}</small></div><a class="btn" href="${url}" download="${esc(name)}">${ico('p',16)}Download</a>`;out.className='proof show';
 }catch(e){out.innerHTML='';const b=document.createElement('div');b.className='t';b.innerHTML='<b>Could not finish</b><small></small>';b.querySelector('small').textContent=e.message;out.append(b);out.className='proof er show'}
 out.scrollIntoView({behavior:'smooth',block:matchMedia('(max-width:820px)').matches?'center':'nearest'});$('bar').classList.remove('on');$('run').textContent=t.run;$('run').disabled=!files.length};
